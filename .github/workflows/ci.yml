name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --locked
      - name: unit + integration tests
        run: cargo test --locked
      - name: clippy
        run: cargo clippy --locked -- -D warnings
      - name: installer (local build path) + doctor
        run: |
          QORAL_BIN_DIR="$RUNNER_TEMP/bin" sh ./install.sh --build
          "$RUNNER_TEMP/bin/qoral" --version
          "$RUNNER_TEMP/bin/qoral" doctor || true   # no agent CLIs on CI; doctor reports that, which is expected
