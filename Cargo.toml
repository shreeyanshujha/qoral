[package]
name = "qoral"
version = "0.3.2"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Many coding agents, one terminal. A multiplexer for Claude Code, Codex, Antigravity and Gemini CLI where agents talk, debate and document."
repository = "https://github.com/shreeyanshujha/qoral"
homepage = "https://github.com/shreeyanshujha/qoral"
readme = "README.md"
keywords = ["ai", "agents", "terminal", "multiplexer", "tui"]
categories = ["command-line-utilities", "development-tools"]
default-run = "qoral"

[[bin]]
name = "qoral"
path = "src/main.rs"

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
dirs = "7"
futures = "0.3"
portable-pty = "0.9"
ratatui = "0.30"
regex = "1"
rmp-serde = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
